{{- with .Values.api.metrics }}
{{- with .serviceMonitor }}
{{- if .enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devflow-api
  labels:
    app.kubernetes.io/name: devflow-api
    app.kubernetes.io/part-of: devflow
spec:
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: devflow-api
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .interval | default "15s" }}
      scrapeTimeout: {{ .scrapeTimeout | default "10s" }}
{{- end }}
{{- end }}
{{- end }}
