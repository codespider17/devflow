services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JENKINS_BASE_IMAGE: jenkins/jenkins:2.568.2-jdk21
    image: devflow/jenkins:2.568.2-1
    container_name: devflow-jenkins
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: >-
        -Xms512m -Xmx2048m
        -Djenkins.install.runSetupWizard=true
      DEVFLOW_CALLBACK_BASE_URL: "${DEVFLOW_CALLBACK_BASE_URL:?DEVFLOW_CALLBACK_BASE_URL is required}"
      DEVFLOW_PIPELINE_CALLBACK_TOKEN: "${DEVFLOW_PIPELINE_CALLBACK_TOKEN:?DEVFLOW_PIPELINE_CALLBACK_TOKEN is required}"
      DEVFLOW_HARBOR_REGISTRY: "${DEVFLOW_HARBOR_REGISTRY:?DEVFLOW_HARBOR_REGISTRY is required}"
      DEVFLOW_HARBOR_PROJECT: "${DEVFLOW_HARBOR_PROJECT:?DEVFLOW_HARBOR_PROJECT is required}"
      DEVFLOW_HARBOR_PUSH_USERNAME: "${DEVFLOW_HARBOR_PUSH_USERNAME:?DEVFLOW_HARBOR_PUSH_USERNAME is required}"
      DEVFLOW_HARBOR_PUSH_SECRET: "${DEVFLOW_HARBOR_PUSH_SECRET:?DEVFLOW_HARBOR_PUSH_SECRET is required}"
    group_add:
      - "${DOCKER_SOCKET_GID:?DOCKER_SOCKET_GID is required}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./init.groovy.d/02-callback-credential.groovy:/var/jenkins_home/init.groovy.d/02-callback-credential.groovy:ro
      - ./init.groovy.d/03-harbor-credential.groovy:/var/jenkins_home/init.groovy.d/03-harbor-credential.groovy:ro
    mem_limit: 3g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  jenkins_home:
    name: devflow_jenkins_home
